name: Build HOS4 debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # Optional keys; empty is fine for a test build.
      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

      - run: chmod +x gradlew

      - name: Build the hos4 debug APK
        run: ./gradlew assembleHos4Debug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-hos4-debug
          path: app/build/outputs/apk/hos4/debug/*.apk
